name: Twice-Daily Trading Agent

on:
  schedule:
    - cron: '0 6 * * 1-5'    # 11:30 AM Indian Standard Time (IST)
    - cron: '30 10 * * 1-5'  # 4:00 PM Indian Standard Time (IST)
  workflow_dispatch:        # Gives you a manual "Run workflow" button

jobs:
  run-trading-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas openpyxl

    - name: Execute Live Agent
      run: python agent.py

    - name: Commit and Push Updated Dashboard Page
      run: |
        git config --global user.name "Stock Agent Bot"
        git config --global user.email "bot@github.com"
        git add README.md
        git commit -m "Automated dashboard matrix update [skip ci]" || echo "No changes to commit"
        git push
