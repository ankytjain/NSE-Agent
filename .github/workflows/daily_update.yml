name: Twice-Daily Trading Agent

on:
  schedule:
    - cron: '0 6 * * 1-5'    # 11:30 AM Indian Standard Time (IST)
    - cron: '30 10 * * 1-5'  # 4:00 PM Indian Standard Time (IST)
  workflow_dispatch:        # Allows you to test it manually via a button

jobs:
  run-trading-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Live Agent
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: python agent.py
